name: Bootstrap Source Tree

on:
  push:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cat .bootstrap/chunks/* > "$work/source.b64"
          base64 --decode "$work/source.b64" > "$work/source.tar.gz"
          mkdir "$work/source"
          tar -xzf "$work/source.tar.gz" -C "$work/source"
          rsync -a --delete --exclude='.git/' "$work/source/" ./
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: implement Metal liquid-glass compositor for Terminal.app"
          git push origin HEAD:main

# Bootstrap source material uploaded by ChatGPT.
