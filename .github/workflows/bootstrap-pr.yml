name: Bootstrap Full Source Tree From Pull Request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.repository == 'machi47/liquidglassmacosterminal'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with push credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and commit the complete source tree
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cat .bootstrap/chunks/* > "$work/source.b64"
          base64 --decode "$work/source.b64" > "$work/source.tar.gz"
          mkdir "$work/source"
          tar -xzf "$work/source.tar.gz" -C "$work/source"
          rsync -a --delete --exclude='.git/' "$work/source/" ./
          rm -rf .bootstrap .github/workflows/bootstrap.yml .github/workflows/bootstrap-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: implement Metal liquid-glass compositor for Terminal.app"
          git push origin HEAD:main
